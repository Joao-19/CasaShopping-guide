version: "3.8"

services:
  # --- BANCO DE DADOS (PostgreSQL) ---
  database:
    image: postgres:15-alpine
    container_name: casashopping-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-casashopping}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - casashopping-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d casashopping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- STORAGE (MinIO - S3 Compatible) ---
  # Sua "carta na manga" para as imagens
  storage:
    image: minio/minio:latest
    container_name: casashopping-storage
    ports:
      - "9000:9000" # API (Back-end acessa aqui)
      - "9001:9001" # Console Web (Você acessa aqui)
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER:-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - casashopping-net

volumes:
  postgres_data:
  minio_data:

networks:
  casashopping-net:
    driver: bridge
