version: "3.8"

services:
  # --- BANCO DE DADOS ---
  database:
    image: postgres:15-alpine
    container_name: casashopping-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-casashopping}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - casashopping-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d casashopping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- STORAGE ---
  storage:
    image: minio/minio:latest
    container_name: casashopping-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER:-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - casashopping-net

  # --- API GATEWAY ---
  api-gateway:
    image: joaovvv/casashopping-api-gateway:latest
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: casashopping-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - AUTH_SERVICE_URL=http://auth-service:3003
      - USERS_SERVICE_URL=http://users-service:3004
      - STORES_SERVICE_URL=http://stores-service:3005
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - STORE_SERVICE_URL=http://stores-service:3005
      - PRODUCTS_SERVICE_URL=http://products-service:3006
      - STORAGE_SERVICE_URL=http://storage-service:3007
    depends_on:
      - database
      - auth-service
      - users-service
      - stores-service
      - products-service
      - storage-service
    networks:
      - casashopping-net

  # --- AUTH SERVICE ---
  auth-service:
    image: joaovvv/casashopping-auth-service:latest
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: casashopping-auth
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
    depends_on:
      - database
    networks:
      - casashopping-net

  # --- USERS SERVICE ---
  users-service:
    image: joaovvv/casashopping-users-service:latest
    build:
      context: .
      dockerfile: apps/users/Dockerfile
    container_name: casashopping-users
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
    depends_on:
      - database
    networks:
      - casashopping-net

  # --- STORAGE SERVICE ---
  storage-service:
    image: joaovvv/casashopping-storage-service:latest
    build:
      context: .
      dockerfile: apps/storage/Dockerfile
    container_name: casashopping-storage-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - MINIO_EXTERNAL_ENDPOINT=http://localhost:9000
      - MINIO_INTERNAL_ENDPOINT=http://storage:9000
      - MINIO_ROOT_USER=${STORAGE_USER:-admin}
      - MINIO_ROOT_PASSWORD=${STORAGE_PASSWORD:-password123}
      - MINIO_BUCKET_NAME=casashopping
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
    depends_on:
      - storage
    networks:
      - casashopping-net

  # --- WEB APP ---
  web:
    image: joaovvv/casashopping-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: casashopping-web
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api-gateway
    networks:
      - casashopping-net

  # --- ADMIN APP ---
  admin:
    image: joaovvv/casashopping-admin:latest
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: casashopping-admin
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - api-gateway
    networks:
      - casashopping-net

  # --- STORES SERVICE ---
  stores-service:
    image: joaovvv/casashopping-stores-service:latest
    build:
      context: .
      dockerfile: apps/stores/Dockerfile
    container_name: casashopping-stores
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
    depends_on:
      - database
    networks:
      - casashopping-net

  # --- PRODUCTS SERVICE ---
  products-service:
    image: joaovvv/casashopping-products-service:latest
    build:
      context: .
      dockerfile: apps/products/Dockerfile
    container_name: casashopping-products
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
    depends_on:
      - database
    networks:
      - casashopping-net
volumes:
  postgres_data:
  minio_data:

networks:
  casashopping-net:
    driver: bridge
