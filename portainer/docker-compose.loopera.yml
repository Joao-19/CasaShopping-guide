# ============================================================================
# CasaShopping — Stack PROD atras de um NGINX CENTRAL
# ============================================================================
# Variante do docker-compose.prod.yml para rodar atras de um nginx central
# (reverse proxy externo). Aqui o casashopping NAO tem nginx proprio nem publica
# portas no host: quem faz a borda (80/443 + SSL) e o nginx-proxy externo.
#
# Diferencas em relacao ao docker-compose.prod.yml:
#   1. SEM servico `nginx-proxy`        -> o nginx central assume a borda.
#   2. SEM `ports:` publicadas no host  -> tudo so na rede docker (seguranca +
#      evita colisao com outras portas ja usadas no host).
#   3. `web`, `admin`, `api-gateway` e `storage` entram na rede externa
#      `web-proxy` (a mesma do nginx central) para serem alcancados por nome.
#   4. Demais servicos ficam so em `casashopping-net` (rede interna).
#
# O nginx central roteia (config fora deste repo):
#   /        -> casashopping-web:3001
#   /api     -> casashopping-gateway:3000
#   /admin   -> casashopping-admin:3002
#   /minio/  -> casashopping-storage:9000   (leitura publica de imagens)
#
# Variaveis: defina na UI do Portainer (ver portainer/.env.loopera.example).
# ============================================================================
version: "3.8"

services:
  # --- BANCO DE DADOS (interno) ---
  database:
    image: postgres:15-alpine
    container_name: casashopping-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-casashopping}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - casashopping-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d casashopping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MIGRATION (AUTO-INIT) ---
  db-migration:
    image: ghcr.io/joao-19/casashopping-migration:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-migration
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
    depends_on:
      database:
        condition: service_healthy
    networks:
      - casashopping-net

  # --- STORAGE (MinIO) ---
  # Em web-proxy tambem, para o nginx central servir /minio/ (leitura de imagens).
  storage:
    image: minio/minio:latest
    container_name: casashopping-storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER:-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - casashopping-net
      - web-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # --- API GATEWAY ---
  api-gateway:
    image: ghcr.io/joao-19/casashopping-api-gateway:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - AUTH_SERVICE_URL=http://auth-service:3003
      - USERS_SERVICE_URL=http://users-service:3004
      - STORES_SERVICE_URL=http://stores-service:3005
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - STORE_SERVICE_URL=http://stores-service:3005
      - PRODUCTS_SERVICE_URL=http://products-service:3006
      - STORAGE_SERVICE_URL=http://storage-service:3007
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - JWT_SECRET=${JWT_SECRET}
      - REPO_PASS=${DEPLOY_PASSWORD}
      - DOCKERHUB_PASSWORD=${DOCKERHUB_PASSWORD}
    depends_on:
      database:
        condition: service_started
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
      stores-service:
        condition: service_started
      products-service:
        condition: service_started
      storage-service:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - casashopping-net
      - web-proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- AUTH SERVICE (interno) ---
  auth-service:
    image: ghcr.io/joao-19/casashopping-auth:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-auth
    restart: unless-stopped
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - casashopping-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3003/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- USERS SERVICE (interno) ---
  users-service:
    image: ghcr.io/joao-19/casashopping-users:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-users
    restart: unless-stopped
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - casashopping-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3004/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- STORAGE SERVICE (interno) ---
  storage-service:
    image: ghcr.io/joao-19/casashopping-storage:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-storage-service
    restart: unless-stopped
    environment:
      - PORT=3007
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=http://storage:9000
      - MINIO_ROOT_USER=${STORAGE_USER:-admin}
      - MINIO_ROOT_PASSWORD=${STORAGE_PASSWORD:-password123}
      - MINIO_BUCKET_NAME=casashopping
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-5}
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB:-50}
    depends_on:
      - storage
    networks:
      - casashopping-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3007/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- WEB APP (publico via nginx central: /) ---
  web:
    image: ghcr.io/joao-19/casashopping-web:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-web
    restart: unless-stopped
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-localhost}
      - NEXT_PUBLIC_STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - NEXT_PUBLIC_BASE_PATH=${WEB_BASE_PATH:-}
      - BASE_PATH=${WEB_BASE_PATH:-}
      - INTERNAL_API_URL=http://api-gateway:3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}
      - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID}
    depends_on:
      - api-gateway
    networks:
      - casashopping-net
      - web-proxy

  # --- ADMIN APP (publico via nginx central: /admin) ---
  admin:
    image: ghcr.io/joao-19/casashopping-admin:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-admin
    restart: unless-stopped
    environment:
      - PORT=3002
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-localhost}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL:-http://localhost:3001}
      - NEXT_PUBLIC_BASE_PATH=${ADMIN_BASE_PATH:-/admin}
      - JWT_SECRET=${JWT_SECRET:-changeme_secret}
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}
      - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID}
    depends_on:
      - api-gateway
    networks:
      - casashopping-net
      - web-proxy

  # --- STORES SERVICE (interno) ---
  stores-service:
    image: ghcr.io/joao-19/casashopping-stores:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-stores
    restart: unless-stopped
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-casashopping}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - casashopping-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3005/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- PRODUCTS SERVICE (interno) ---
  products-service:
    image: ghcr.io/joao-19/casashopping-products:${TAG:-prod}
    pull_policy: always
    container_name: casashopping-products
    restart: unless-stopped
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-admin123}@database:5432/${DB_NAME:-casashopping}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - STORAGE_SERVICE_URL=http://storage-service:3007
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-casashopping}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - casashopping-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3006/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:

networks:
  casashopping-net:
    driver: bridge
  web-proxy:
    external: true
</content>
