# ============================================================================
# CasaShopping — Stack para PORTAINER (consome imagens do GHCR)
# ============================================================================
#
# Este arquivo NAO substitui o docker-compose.yml da raiz (que continua sendo
# o deploy atual via Docker Hub + Watchtower). Este e um stack NOVO, pensado
# para rodar no Portainer puxando as imagens publicadas no GHCR pelos
# workflows .github/workflows/deploy-{dev,prod}.yml.
#
# COMO USAR (resumo — detalhes em portainer/README.md):
#   1. No Portainer: Stacks > Add stack > "Repository" (Git) apontando para
#      este repo + caminho `portainer/docker-compose.yml`, OU cole o conteudo.
#   2. Defina as variaveis de ambiente da stack (ver portainer/.env.example).
#      A unica obrigatoria para escolher a versao e: TAG=dev  ou  TAG=stable
#   3. Deploy. Para atualizar depois de um novo build: "Pull and redeploy".
#
# As imagens sao agnosticas de ambiente: os NEXT_PUBLIC_* sao resolvidos em
# runtime pelo entrypoint (placeholders APP_*). So o basePath (web na raiz,
# admin em /admin) e assado no build pelos workflows.
# ============================================================================

services:
  # ---------------------------------------------------------------- NGINX ----
  nginx-proxy:
    image: nginx:alpine
    container_name: csg-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - web
      - admin
    networks:
      - csg-net

  # ------------------------------------------------------------- DATABASE ----
  # Postgres local (self-contained). Se for usar banco gerenciado (Neon/RDS),
  # deixe DATABASE_URL apontando pra ele e voce pode remover este servico.
  database:
    image: postgres:15-alpine
    container_name: csg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-casashopping}
    volumes:
      - csg_postgres_data:/var/lib/postgresql/data
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-casashopping}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------ MIGRATION ----
  db-migration:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-migration:${TAG:-stable}
    pull_policy: always
    container_name: csg-migration
    restart: on-failure
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin123@database:5432/casashopping?schema=public}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - csg-net

  # --------------------------------------------------------------- MINIO -----
  storage:
    image: minio/minio:latest
    container_name: csg-storage
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER:-admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:-password123}
    command: server /data --console-address ":9001"
    volumes:
      - csg_minio_data:/data
    networks:
      - csg-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------- API GATEWAY ----
  api-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-api-gateway:${TAG:-stable}
    pull_policy: always
    container_name: csg-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin123@database:5432/casashopping?schema=public}
      - AUTH_SERVICE_URL=http://auth-service:3003
      - USERS_SERVICE_URL=http://users-service:3004
      - STORES_SERVICE_URL=http://stores-service:3005
      - STORE_SERVICE_URL=http://stores-service:3005
      - PRODUCTS_SERVICE_URL=http://products-service:3006
      - STORAGE_SERVICE_URL=http://storage-service:3007
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      users-service:
        condition: service_started
      stores-service:
        condition: service_started
      products-service:
        condition: service_started
      storage-service:
        condition: service_started
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3000/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"']
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------- AUTH ----
  auth-service:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-auth:${TAG:-stable}
    pull_policy: always
    container_name: csg-auth
    restart: unless-stopped
    environment:
      - PORT=3003
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin123@database:5432/casashopping?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3003/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"']
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------- USERS ----
  users-service:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-users:${TAG:-stable}
    pull_policy: always
    container_name: csg-users
    restart: unless-stopped
    environment:
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin123@database:5432/casashopping?schema=public}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3004/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"']
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------------- STORES ----
  stores-service:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-stores:${TAG:-stable}
    pull_policy: always
    container_name: csg-stores
    restart: unless-stopped
    environment:
      - PORT=3005
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin123@database:5432/casashopping?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-casashopping}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3005/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"']
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------- PRODUCTS ----
  products-service:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-products:${TAG:-stable}
    pull_policy: always
    container_name: csg-products
    restart: unless-stopped
    environment:
      - PORT=3006
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:admin123@database:5432/casashopping?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - STORAGE_SERVICE_URL=http://storage-service:3007
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-casashopping}
    depends_on:
      database:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3006/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"']
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------- STORAGE SERVICE ---
  storage-service:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-storage:${TAG:-stable}
    pull_policy: always
    container_name: csg-storage-service
    restart: unless-stopped
    environment:
      - PORT=3007
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      - MINIO_INTERNAL_ENDPOINT=http://storage:9000
      - MINIO_ROOT_USER=${STORAGE_USER:-admin}
      - MINIO_ROOT_PASSWORD=${STORAGE_PASSWORD:-password123}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-casashopping}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-5}
      - MAX_VIDEO_SIZE_MB=${MAX_VIDEO_SIZE_MB:-50}
    depends_on:
      - storage
    networks:
      - csg-net
    healthcheck:
      test: ["CMD-SHELL", 'node -e "require(''http'').get(''http://localhost:3007/health'', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"']
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------------ WEB ----
  web:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-web:${TAG:-stable}
    pull_policy: always
    container_name: csg-web
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_URL=http://api-gateway:3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-localhost}
      - NEXT_PUBLIC_STORAGE_URL=${STORAGE_URL:-http://localhost:9000/casashopping}
      - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID:-}
      - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID:-}
    depends_on:
      - api-gateway
    networks:
      - csg-net

  # ---------------------------------------------------------------- ADMIN ----
  admin:
    image: ${IMAGE_PREFIX:-ghcr.io/joao-19/casashopping}-admin:${TAG:-stable}
    pull_policy: always
    container_name: csg-admin
    restart: unless-stopped
    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
      - NEXT_PUBLIC_API_HOST=${NEXT_PUBLIC_API_HOST:-localhost}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL:-http://localhost}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID:-}
      - NEXT_PUBLIC_GA4_ID=${NEXT_PUBLIC_GA4_ID:-}
    depends_on:
      - api-gateway
    networks:
      - csg-net

volumes:
  csg_postgres_data:
  csg_minio_data:

networks:
  csg-net:
    driver: bridge
