# ============================================================================
# CasaShopping Guide - Nginx para a stack do PORTAINER
# ============================================================================
# Copia fiel do default.conf da raiz. Unica mudanca: server_name _ (em vez do
# IP fixo do Oracle), para ser portatil entre hosts. Roteamento e upstreams
# (por nome de servico) identicos ao de producao.
# ============================================================================

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Buffer settings for large headers/cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Global Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Manutencao: app fora do ar (502/503/504) cai na pagina da marca em vez
    # do erro cru. Assets montados em /usr/share/nginx/maintenance/ (ver
    # portainer/manutencao.html + .png e portainer/README.md).
    error_page 502 503 504 @maintenance;

    location @maintenance {
        root /usr/share/nginx/maintenance;
        rewrite ^.*$ /manutencao.html break;
        add_header Cache-Control "no-store";
    }

    # 1. Admin Panel - Next.js (Standalone)
    location /admin {
        set $upstream_admin admin;
        proxy_pass http://$upstream_admin:3002;

        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_redirect off;

        # Next.js standalone support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. API Gateway
    location /api {
        set $upstream_api api-gateway;
        rewrite ^/api/?(.*) /$1 break;
        proxy_pass http://$upstream_api:3000;

        proxy_redirect off;
    }

    # 3. MinIO S3 API
    location /minio/ {
        set $upstream_minio_api storage;
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://$upstream_minio_api:9000;

        # MinIO precisa do host original para validar a assinatura
        proxy_set_header Host $http_host;

        # Suporte a uploads grandes (até 100MB)
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 4. MinIO Console (UI web)
    location /storage/ {
        set $upstream_minio storage;
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass http://$upstream_minio:9001;
    }

    # 5. Web App - Next.js (Standalone)
    location / {
        set $upstream_web web;
        proxy_pass http://$upstream_web:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
