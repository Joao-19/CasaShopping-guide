# ============================================================================
# CasaShopping — Nginx para a stack do PORTAINER
# ============================================================================
# Igual em roteamento ao default.conf da raiz, mas SEM IP hardcoded
# (server_name _) para ser portatil entre hosts. Os upstreams usam os nomes
# de servico do compose do Portainer (web, admin, api-gateway, storage).
# ============================================================================

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # Buffers para headers/cookies grandes
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # 1. Admin Panel - Next.js (standalone)
    location /admin {
        set $upstream_admin admin;
        proxy_pass http://$upstream_admin:3002;

        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. API Gateway
    location /api {
        set $upstream_api api-gateway;
        rewrite ^/api/?(.*) /$1 break;
        proxy_pass http://$upstream_api:3000;
        proxy_redirect off;
    }

    # 3. MinIO S3 API
    location /minio/ {
        set $upstream_minio_api storage;
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://$upstream_minio_api:9000;

        proxy_set_header Host $http_host;

        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 4. MinIO Console (UI)
    location /storage/ {
        set $upstream_minio storage;
        rewrite ^/storage/(.*) /$1 break;
        proxy_pass http://$upstream_minio:9001;
    }

    # 5. Web App - Next.js (standalone)
    location / {
        set $upstream_web web;
        proxy_pass http://$upstream_web:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
