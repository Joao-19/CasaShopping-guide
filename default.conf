server {
    listen 80;
    server_name guiadecompras.casashopping.com;
    return 301 https://$host$request_uri;
}

# ----------------------------
# HTTPS storage (MinIO)
# ----------------------------
server {
    listen 443 ssl;
    server_name storage.casashopping.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/origin.key;

    # Docker DNS: re-resolve IP dos containers (fix do 502 apos recriacao).
    # Sem isso o nginx cacheia o IP no boot; quando o watchtower recria um
    # container ele ganha IP novo e o proxy passa a bater em IP morto (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    location / {
        set $up_storage casashopping-storage;
        proxy_pass http://$up_storage:9000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------
# HTTPS (app)
# ----------------------------
server {
    listen 443 ssl;
    server_name guiadecompras.casashopping.com;

    ssl_certificate     /etc/nginx/ssl/cloudflare/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker DNS: re-resolve IP dos containers (fix do 502 apos recriacao).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Manutencao: app fora do ar (502/503/504) cai na pagina da marca em vez
    # do erro cru. Assets montados em /usr/share/nginx/maintenance/ (ver
    # portainer/manutencao.html + .png e portainer/README.md).
    # =503: serve a pagina com status 503 (Service Unavailable) em vez de
    # preservar o 502/504 cru. Sem o =503 o nginx mantem o codigo de erro
    # original e o Cloudflare intercepta com a tela de erro dele.
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /usr/share/nginx/maintenance;
        rewrite ^.*$ /manutencao.html break;
        add_header Cache-Control "no-store";
    }

    # Imagem de fundo da pagina de manutencao: servida direto com 200, fora do
    # error_page. Se passasse pelo @maintenance sairia com 503 e o navegador
    # nao renderiza imagem com status de erro. Referenciada por caminho
    # absoluto no manutencao.html.
    location = /magnific_cinematic-wideangle-photo_YVPyuJiWeC.png {
        root /usr/share/nginx/maintenance;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        set $up_gw casashopping-gateway;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$up_gw:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        set $up_admin casashopping-admin;
        proxy_pass http://$up_admin:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $up_web casashopping-web;
        proxy_pass http://$up_web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
