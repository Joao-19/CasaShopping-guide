# ============================================================================
# Deploy Prod (GHCR) — pipeline NOVO, isolado do deploy atual.
#
# O QUE FAZ: ao dar push em `main`, builda as 9 imagens e publica no
# GitHub Container Registry (GHCR) no canal :stable. NADA mais.
#
# O QUE NAO FAZ (de proposito): nao faz push pro Docker Hub, nao mexe no
# Watchtower, nao faz SSH em servidor nenhum, nao dispara redeploy. O
# redeploy no Portainer e MANUAL (a TI clica "Re-pull" na UI).
#
# ISOLAMENTO TOTAL do deploy atual:
#   - Registry diferente: ghcr.io (atual usa Docker Hub joaovvv/*).
#   - Tags diferentes: :stable / :stable-<data>-<sha> (atual usa :latest no Docker Hub).
#   - O Watchtower de producao so vigia joaovvv/casashopping-*:latest no
#     Docker Hub -> ele NUNCA enxerga nada publicado aqui.
#   - O workflow ATUAL (.github/workflows/deploy.yml) dispara em `main1`,
#     entao este (em `main`) nao colide com ele.
#   - Usa apenas o GITHUB_TOKEN automatico (sem secrets a configurar).
# ============================================================================
name: Deploy Prod (GHCR)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Nao cancela um build em andamento se vier outro push (evita imagem pela metade)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Namespace do GHCR (owner do repo em minusculo). Imagens: <PREFIX>-<servico>
  IMAGE_PREFIX: ghcr.io/joao-19/casashopping
  CHANNEL: stable
  # Arquitetura do host Portainer de PROD. Default amd64 (VPS comum).
  # Se o host for ARM (ex: Oracle Ampere), troque para: linux/arm64
  PLATFORMS: linux/amd64

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Calcular tag imutavel (stable-YYYYMMDD-HHMM-<sha7>)
        id: tag
        run: |
          echo "tag=${CHANNEL}-$(date -u +'%Y%m%d-%H%M')-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, file: apps/api-gateway/Dockerfile }
          - { name: auth,        file: apps/auth/Dockerfile }
          - { name: users,       file: apps/users/Dockerfile }
          - { name: stores,      file: apps/stores/Dockerfile }
          - { name: products,    file: apps/products/Dockerfile }
          - { name: storage,     file: apps/storage/Dockerfile }
          - { name: migration,   file: apps/migration/Dockerfile }
          - { name: web,         file: apps/web/Dockerfile,   buildArgs: "BASE_PATH=" }
          - { name: admin,       file: apps/admin/Dockerfile, buildArgs: "BASE_PATH=/admin" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (${{ matrix.service.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service.file }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: ${{ matrix.service.buildArgs }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ env.CHANNEL }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:buildcache-${{ env.CHANNEL }}
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:buildcache-${{ env.CHANNEL }},mode=max

  summary:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Resumo do que foi publicado
        run: |
          {
            echo "## Imagens publicadas no GHCR (canal \`${CHANNEL}\`)"
            echo ""
            echo "- Tag flutuante: \`${IMAGE_PREFIX}-<servico>:${CHANNEL}\`"
            echo "- Tag imutavel: \`${IMAGE_PREFIX}-<servico>:${{ needs.prepare.outputs.tag }}\`"
            echo ""
            echo "Redeploy no Portainer e **manual**: abra a stack de prod e use **Pull and redeploy**."
          } >> "$GITHUB_STEP_SUMMARY"
