name: Build & Deploy

on:
  push:
    branches: ["main", "admin"] # Só roda quando commitar na main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Configura o QEMU para conseguir emular o processador ARM da Oracle
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Configura o Docker Buildx (o construtor multi-plataforma)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Loga no Docker Hub
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Builda para ARM64 (Oracle) e envia para o Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: . # Ou a pasta onde está seu Dockerfile (ex: ./apps/web)
          file: ./Dockerfile # Caminho do seu Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/casashopping-web:latest
          platforms: linux/arm64 # ⚠️ O SEGREDO ESTÁ AQUI (Compila para ARM)

  deploy-to-oracle:
    needs: build-and-push # Só roda se o build der certo
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_KEY }}
          script: |
            # Entra na pasta
            cd ~/apps/CasaShopping-guide

            # Baixa a versão nova do Git (se tiver mudado docker-compose)
            git pull

            # Baixa a imagem nova do Docker Hub
            docker compose pull

            # Recria os containers
            docker compose up -d

            # Limpa o lixo (imagens velhas)
            docker image prune -f
